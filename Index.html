<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Uncle Joe's Gameshack</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #FF6B00;
            --bg: #0d0e12;
            --surface: #16181d;
            --surface2: #1e2028;
            --text: #f0f2f5;
            --border: #2a2d35;
            --radius: 20px;
            --bar-height: 56px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        /* ══════════════════════════════════════
           OVERLAY — covers the whole viewport
        ══════════════════════════════════════ */
        #launcher-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            flex-direction: column;
            background: var(--bg);
            /* Slide up animation */
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }

        #launcher-overlay.open {
            display: flex;
            transform: translateY(0);
        }

        /* ── TOP BAR ── */
        #launcher-bar {
            height: calc(var(--bar-height) + var(--safe-top));
            padding-top: var(--safe-top);
            background: var(--surface);
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            padding-left: 14px;
            padding-right: 14px;
            flex-shrink: 0;
        }

        #launcher-bar .uj-logo {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            color: var(--accent);
            white-space: nowrap;
            flex-shrink: 0;
            letter-spacing: -0.02em;
        }

        #launcher-bar .uj-logo span {
            color: var(--text);
            opacity: 0.5;
        }

        .bar-divider {
            width: 1px;
            height: 24px;
            background: var(--border);
            flex-shrink: 0;
        }

        #game-thumb-bar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid var(--border);
            flex-shrink: 0;
            display: none;
        }

        #game-title-bar {
            font-weight: 900;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }

        .bar-btn {
            background: var(--surface2);
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            padding: 6px 14px;
            font-family: inherit;
            font-weight: 900;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 5px;
            min-height: 36px;
            transition: border-color 0.15s, background 0.15s;
        }
        .bar-btn:hover { border-color: var(--accent); background: #2a1a0a; }
        .bar-btn:active { opacity: 0.7; }

        .bar-btn.close-btn {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .bar-btn.close-btn:hover { background: #e05e00; border-color: #e05e00; }

        /* ── FRAME AREA ── */
        #launcher-frame-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #launcher-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ── LOADING SCREEN ── */
        #launcher-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: var(--bg);
            z-index: 10;
        }

        .loading-thumb {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            object-fit: cover;
            border: 3px solid var(--border);
            display: none;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #loading-title {
            font-weight: 900;
            font-size: 1rem;
            opacity: 0.6;
            max-width: 260px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ── BLOCKED SCREEN ── */
        #launcher-blocked {
            display: none;
            position: absolute;
            inset: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            text-align: center;
            padding: 30px;
            background: var(--bg);
            z-index: 10;
        }

        .blocked-icon { font-size: 3.5rem; line-height: 1; }

        #launcher-blocked h2 {
            font-size: 1.3rem;
            font-weight: 900;
        }

        #launcher-blocked p {
            font-size: 0.9rem;
            opacity: 0.6;
            max-width: 320px;
            line-height: 1.6;
        }

        .open-direct-btn {
            margin-top: 4px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            padding: 13px 32px;
            font-family: inherit;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.15s;
        }
        .open-direct-btn:hover { background: #e05e00; }

        .blocked-url {
            font-size: 0.65rem;
            opacity: 0.3;
            word-break: break-all;
            max-width: 380px;
        }
    </style>
</head>
<body>

<!-- ══════════════════════════════════════
     This is the launcher overlay.
     It auto-opens when ?play= is in the URL.
     You can also embed this file's contents
     into your Base44 app's HTML page.
══════════════════════════════════════ -->

<div id="launcher-overlay">

    <!-- Top bar -->
    <div id="launcher-bar">
        <div class="uj-logo">Uncle Joe's <span>Gameshack</span></div>
        <div class="bar-divider"></div>
        <img id="game-thumb-bar" src="" alt="">
        <div id="game-title-bar">Loading...</div>
        <button class="bar-btn" id="open-direct-btn" onclick="openDirect()">⬡ OPEN DIRECT</button>
        <button class="bar-btn close-btn" onclick="closeLauncher()">✕ CLOSE</button>
    </div>

    <!-- Frame area -->
    <div id="launcher-frame-wrap">

        <!-- Loading state -->
        <div id="launcher-loading">
            <img class="loading-thumb" id="loading-thumb-img" src="" alt="">
            <div class="spinner"></div>
            <div id="loading-title">Loading game...</div>
        </div>

        <!-- Blocked state -->
        <div id="launcher-blocked">
            <div class="blocked-icon">⚠️</div>
            <h2>Site Blocked Embedding</h2>
            <p>This game refused to load inside Uncle Joe's. You can still open it directly.</p>
            <a class="open-direct-btn" id="blocked-open-btn" href="#" target="_blank">Open Game →</a>
            <div class="blocked-url" id="blocked-url-label"></div>
        </div>

        <!-- Game iframe -->
        <iframe id="launcher-frame" src="" allowfullscreen allow="fullscreen; autoplay"></iframe>

    </div>
</div>

<script>
    let currentGameUrl = '';

    function openLauncher(url, title, thumb) {
        currentGameUrl = url;

        // Set bar info
        document.getElementById('game-title-bar').textContent = title || 'Game';
        const thumbBar = document.getElementById('game-thumb-bar');
        if (thumb) {
            thumbBar.src   = thumb;
            thumbBar.style.display = 'block';
        } else {
            thumbBar.style.display = 'none';
        }

        // Set loading screen
        const loadThumb = document.getElementById('loading-thumb-img');
        if (thumb) {
            loadThumb.src   = thumb;
            loadThumb.style.display = 'block';
        }
        document.getElementById('loading-title').textContent = 'Loading ' + (title || 'game') + '…';

        // Reset states
        document.getElementById('launcher-loading').style.display  = 'flex';
        document.getElementById('launcher-blocked').style.display  = 'none';
        document.getElementById('launcher-frame').style.display    = 'block';
        document.getElementById('launcher-frame').src = '';

        // Open overlay
        const overlay = document.getElementById('launcher-overlay');
        overlay.style.display = 'flex';
        // Force reflow so transition fires
        overlay.offsetHeight;
        overlay.classList.add('open');

        // Lock body scroll
        document.body.style.overflow = 'hidden';

        // Load the game
        loadGame(url, title);
    }

    function loadGame(url, title) {
        const frame    = document.getElementById('launcher-frame');
        const loading  = document.getElementById('launcher-loading');
        const blocked  = document.getElementById('launcher-blocked');
        let settled    = false;

        function showFrame() {
            if (settled) return;
            settled = true;
            loading.style.display = 'none';
        }

        function showBlocked() {
            if (settled) return;
            settled = true;
            loading.style.display = 'none';
            blocked.style.display = 'flex';
            frame.style.display   = 'none';

            // Set direct-open links
            document.getElementById('blocked-open-btn').href  = url;
            document.getElementById('blocked-url-label').textContent = url;
        }

        frame.onload = function () {
            try {
                const doc = frame.contentDocument || frame.contentWindow.document;
                if (!doc || doc.URL === 'about:blank' || (doc.body && doc.body.innerHTML.trim() === '')) {
                    showBlocked();
                } else {
                    showFrame();
                }
            } catch (e) {
                // Cross-origin = loaded fine
                showFrame();
            }
        };

        frame.onerror = () => showBlocked();

        // Check at 2s — catches "refused to connect" which fires onload with blank doc
        setTimeout(() => {
            if (settled) return;
            try {
                const doc = frame.contentDocument || frame.contentWindow.document;
                if (!doc || doc.URL === 'about:blank' || !doc.body || doc.body.innerHTML.trim() === '') showBlocked();
                else showFrame();
            } catch (e) { showFrame(); }
        }, 2000);

        // Hard timeout at 5s
        setTimeout(() => { if (!settled) showBlocked(); }, 5000);

        // Set src last so onload is already attached
        frame.src = url;
    }

    function closeLauncher() {
        const overlay = document.getElementById('launcher-overlay');
        overlay.classList.remove('open');
        setTimeout(() => {
            overlay.style.display = 'none';
            document.getElementById('launcher-frame').src = ''; // stop the game
            document.body.style.overflow = '';
        }, 350);
    }

    function openDirect() {
        if (currentGameUrl) window.open(currentGameUrl, '_blank');
    }

    // ── Auto-launch from URL params ──
    // Reads ?play=URL&title=Name&thumb=imgURL
    // Works whether this is a standalone page or embedded in Base44
    (function () {
        const params = new URLSearchParams(window.location.search);
        const play   = params.get('play');
        const title  = params.get('title') || 'Game';
        const thumb  = params.get('thumb') || '';

        if (play) {
            // Small delay so the page/Base44 app has time to render first
            setTimeout(() => openLauncher(decodeURIComponent(play), title, thumb), 300);
        }
    })();

    // ── Allow other scripts on the page to trigger the launcher ──
    // e.g. window.ujLaunch('https://game.com', 'Bloons', 'thumb.jpg')
    window.ujLaunch = openLauncher;
</script>
</body>
</html>
