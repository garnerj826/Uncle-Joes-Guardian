<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Uncle Joe's Guardian — Teacher Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a14; --surface: #111122; --surface2: #1a1a2e;
      --border: rgba(99,102,241,0.15); --accent: #6366f1; --accent2: #818cf8;
      --danger: #ef4444; --success: #22c55e; --warn: #f59e0b;
      --text: #e2e8f0; --muted: #64748b;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'DM Sans',system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

    /* Topbar */
    .topbar { display:flex; align-items:center; gap:14px; padding:10px 20px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
    .logo { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; }
    .logo span { color:var(--accent2); }
    .conn-badge { display:flex; align-items:center; gap:5px; font-size:11px; padding:3px 9px; border-radius:20px; background:rgba(239,68,68,0.12); color:var(--danger); border:1px solid rgba(239,68,68,0.2); }
    .conn-badge.connected { background:rgba(34,197,94,0.1); color:var(--success); border-color:rgba(34,197,94,0.2); }
    .conn-badge .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
    .server-input { display:flex; gap:6px; }
    .server-input input { background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:4px 9px; border-radius:6px; font-size:11px; font-family:'DM Mono',monospace; width:190px; outline:none; }
    .btn-sm { padding:4px 11px; border-radius:6px; border:none; font-size:11px; font-weight:600; cursor:pointer; background:var(--accent); color:white; }
    .topbar-right { margin-left:auto; display:flex; align-items:center; gap:8px; }
    .count-badge { font-size:11px; color:var(--muted); background:var(--surface2); padding:3px 9px; border-radius:20px; border:1px solid var(--border); }

    /* View toggle */
    .view-toggle { display:flex; gap:2px; background:var(--surface2); border-radius:6px; padding:2px; border:1px solid var(--border); }
    .view-btn { padding:4px 10px; border-radius:4px; border:none; font-size:11px; font-weight:600; cursor:pointer; color:var(--muted); background:none; }
    .view-btn.active { background:var(--accent); color:white; }

    /* Layout */
    .main { display:flex; flex:1; overflow:hidden; }

    /* Sidebar */
    .sidebar { width:240px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow-y:auto; }
    .sidebar-section { padding:14px; border-bottom:1px solid var(--border); }
    .sidebar-label { font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
    .big-btn { width:100%; padding:9px; border-radius:7px; border:none; font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:7px; margin-bottom:5px; }
    .big-btn:hover { filter:brightness(1.15); }
    .big-btn.danger { background:rgba(239,68,68,0.15); color:#fca5a5; border:1px solid rgba(239,68,68,0.3); }
    .big-btn.success { background:rgba(34,197,94,0.12); color:#86efac; border:1px solid rgba(34,197,94,0.25); }
    .big-btn.warn { background:rgba(245,158,11,0.12); color:#fcd34d; border:1px solid rgba(245,158,11,0.25); }
    .big-btn.primary { background:rgba(99,102,241,0.15); color:#a5b4fc; border:1px solid rgba(99,102,241,0.3); }
    .big-btn.neutral { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
    .target-select { width:100%; padding:6px 9px; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:6px; font-size:12px; outline:none; margin-bottom:9px; }
    .range-row { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
    .range-row input[type=range] { flex:1; accent-color:var(--accent); }
    .range-val { font-size:11px; font-family:'DM Mono',monospace; color:var(--accent2); width:30px; text-align:right; }
    .site-input-row { display:flex; gap:5px; margin-bottom:7px; }
    .site-input { flex:1; padding:5px 8px; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:6px; font-size:11px; font-family:'DM Mono',monospace; outline:none; }
    .site-input::placeholder { opacity:0.4; }
    .site-tag { display:inline-flex; align-items:center; gap:4px; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.2); color:#fca5a5; border-radius:4px; padding:2px 7px; font-size:10px; font-family:'DM Mono',monospace; margin:2px; }
    .site-tag button { background:none; border:none; color:currentColor; cursor:pointer; font-size:11px; }

    /* Content */
    .content { flex:1; overflow-y:auto; padding:16px; background:var(--bg); }

    /* Tab view - student cards */
    .students-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:12px; }
    .student-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .student-card.locked { border-color:rgba(239,68,68,0.4); }
    .card-header { display:flex; align-items:center; gap:9px; padding:11px 13px 9px; border-bottom:1px solid var(--border); }
    .avatar { width:32px; height:32px; border-radius:7px; background:linear-gradient(135deg,var(--accent),#8b5cf6); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0; }
    .card-name { font-size:13px; font-weight:600; }
    .card-id { font-size:10px; color:var(--muted); font-family:'DM Mono',monospace; }
    .card-badges { margin-left:auto; display:flex; gap:3px; }
    .badge { font-size:10px; padding:2px 6px; border-radius:10px; font-weight:600; }
    .badge.locked { background:rgba(239,68,68,0.15); color:#fca5a5; }
    .badge.online { background:rgba(34,197,94,0.12); color:#86efac; }
    .card-tabs { padding:7px 13px; max-height:110px; overflow-y:auto; }
    .tab-item { display:flex; align-items:center; gap:7px; padding:3px 0; font-size:11px; border-bottom:1px solid rgba(255,255,255,0.04); }
    .tab-item:last-child { border:none; }
    .tab-favicon { width:13px; height:13px; flex-shrink:0; }
    .tab-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tab-url { font-size:10px; color:var(--muted); font-family:'DM Mono',monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100px; }
    .tab-close { background:none; border:none; color:var(--muted); cursor:pointer; padding:1px 3px; border-radius:3px; font-size:10px; }
    .tab-close:hover { background:rgba(239,68,68,0.15); color:var(--danger); }
    .card-footer { display:flex; gap:5px; padding:7px 13px; background:var(--surface2); border-top:1px solid var(--border); }
    .card-action { flex:1; padding:5px; border-radius:5px; border:none; font-size:10px; font-weight:600; cursor:pointer; }
    .card-action.lock { background:rgba(239,68,68,0.15); color:#fca5a5; }
    .card-action.lock:hover { background:rgba(239,68,68,0.3); }
    .card-action.unlock { background:rgba(34,197,94,0.12); color:#86efac; }
    .card-action.unlock:hover { background:rgba(34,197,94,0.25); }
    .card-action.closetabs { background:rgba(245,158,11,0.1); color:#fcd34d; }
    .card-action.closetabs:hover { background:rgba(245,158,11,0.25); }

    /* Screen view */
    .screens-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; }
    .screen-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; cursor:pointer; transition:border-color 0.2s; }
    .screen-card:hover { border-color:rgba(99,102,241,0.5); }
    .screen-card.locked { border-color:rgba(239,68,68,0.5); }
    .screen-header { display:flex; align-items:center; gap:8px; padding:9px 12px; background:var(--surface2); border-bottom:1px solid var(--border); }
    .screen-name { font-size:12px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .screen-tab { font-size:10px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px; }
    .screen-preview { position:relative; aspect-ratio:16/9; background:#000; overflow:hidden; }
    .screen-preview img { width:100%; height:100%; object-fit:cover; display:block; }
    .screen-placeholder { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muted); font-size:12px; gap:8px; }
    .screen-placeholder .ph-icon { font-size:32px; opacity:0.4; }
    .screen-lock-overlay { position:absolute; inset:0; background:rgba(15,12,41,0.92); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:#fca5a5; font-size:13px; font-weight:600; }
    .screen-lock-overlay .lock-icon { font-size:28px; }
    .screen-footer { display:flex; gap:5px; padding:7px 10px; border-top:1px solid var(--border); }
    .screen-btn { flex:1; padding:5px; border-radius:5px; border:none; font-size:10px; font-weight:600; cursor:pointer; }
    .screen-btn.lock { background:rgba(239,68,68,0.15); color:#fca5a5; }
    .screen-btn.lock:hover { background:rgba(239,68,68,0.3); }
    .screen-btn.unlock { background:rgba(34,197,94,0.12); color:#86efac; }
    .screen-btn.unlock:hover { background:rgba(34,197,94,0.25); }
    .screen-btn.closetabs { background:rgba(245,158,11,0.1); color:#fcd34d; }

    /* Fullscreen modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; display:none; align-items:center; justify-content:center; padding:20px; }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; max-width:1000px; width:100%; }
    .modal-header { display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--surface2); border-bottom:1px solid var(--border); }
    .modal-title { font-size:14px; font-weight:600; flex:1; }
    .modal-close { background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:2px 6px; border-radius:4px; }
    .modal-close:hover { color:var(--text); background:var(--surface); }
    .modal-img { width:100%; display:block; }
    .modal-footer { display:flex; gap:8px; padding:10px 16px; background:var(--surface2); border-top:1px solid var(--border); }
    .modal-btn { padding:7px 16px; border-radius:7px; border:none; font-size:12px; font-weight:600; cursor:pointer; }
    .modal-btn.lock { background:rgba(239,68,68,0.15); color:#fca5a5; border:1px solid rgba(239,68,68,0.3); }
    .modal-btn.unlock { background:rgba(34,197,94,0.12); color:#86efac; border:1px solid rgba(34,197,94,0.25); }
    .modal-btn.closetabs { background:rgba(245,158,11,0.1); color:#fcd34d; border:1px solid rgba(245,158,11,0.25); }

    /* Empty state */
    .empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
    .empty-state .ei { font-size:48px; margin-bottom:12px; }

    /* Toast */
    #toast { position:fixed; bottom:18px; right:18px; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:9px 14px; border-radius:7px; font-size:12px; box-shadow:0 4px 20px rgba(0,0,0,0.4); opacity:0; transform:translateY(8px); transition:all 0.2s; pointer-events:none; z-index:999; }
    #toast.show { opacity:1; transform:translateY(0); }

    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-thumb { background:rgba(99,102,241,0.3); border-radius:2px; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo">🛡️ Uncle <span>Joe's Guardian</span></div>
  <div class="server-input">
    <input type="text" id="serverUrl" placeholder="auto-detected"/>
    <button class="btn-sm" onclick="connectWS()">Connect</button>
  </div>
  <div class="conn-badge" id="connBadge"><div class="dot"></div><span id="connText">Disconnected</span></div>
  <div class="topbar-right">
    <div class="count-badge"><span id="studentCount">0</span> students</div>
    <div class="view-toggle">
      <button class="view-btn" id="btnTabView" onclick="setView('tabs')">📋 Tabs</button>
      <button class="view-btn active" id="btnScreenView" onclick="setView('screens')">🖥️ Screens</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Target</div>
      <select class="target-select" id="targetSelect">
        <option value="all">🌐 All Students</option>
      </select>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Screen Control</div>
      <button class="big-btn danger" onclick="cmd('LOCK_SCREEN')"><span>🔒</span> Lock Screen</button>
      <button class="big-btn success" onclick="cmd('UNLOCK_SCREEN')"><span>🔓</span> Unlock Screen</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Tab Control</div>
      <button class="big-btn warn" onclick="cmd('CLOSE_ALL_TABS')"><span>✕</span> Close All Tabs</button>
      <div class="range-row">
        <span style="font-size:11px;color:var(--muted)">Tab limit</span>
        <input type="range" id="tabLimitSlider" min="0" max="10" value="0" oninput="updateTabLimit(this.value)"/>
        <span class="range-val" id="tabLimitVal">Off</span>
      </div>
      <button class="big-btn primary" onclick="applyTabLimit()"><span>📌</span> Apply Tab Limit</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Block Websites</div>
      <div class="site-input-row">
        <input class="site-input" id="siteInput" placeholder="youtube.com" onkeydown="if(event.key==='Enter')addSite()"/>
        <button class="btn-sm" onclick="addSite()">Add</button>
      </div>
      <div id="siteList"></div>
      <button class="big-btn danger" onclick="applyBlockList()" style="margin-top:7px"><span>🚫</span> Apply Block List</button>
      <button class="big-btn neutral" onclick="clearBlockList()"><span>↩</span> Clear Blocks</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Navigate To</div>
      <div class="site-input-row">
        <input class="site-input" id="navInput" placeholder="https://..."/>
      </div>
      <button class="big-btn primary" onclick="applyNavigate()"><span>→</span> Go To URL</button>
    </div>
  </div>

  <div class="content" id="content">
    <div id="emptyState" class="empty-state">
      <div class="ei">👩‍💻</div>
      <h2>No students connected</h2>
      <p>Students appear here once they open Chrome with the extension.</p>
    </div>
    <div class="students-grid" id="tabsGrid" style="display:none"></div>
    <div class="screens-grid" id="screensGrid"></div>
  </div>
</div>

<!-- Fullscreen modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Student Screen</div>
      <div id="modalTabTitle" style="font-size:11px;color:var(--muted);flex:1"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <img class="modal-img" id="modalImg" src="" alt="Student screen"/>
    <div class="modal-footer">
      <button class="modal-btn lock" id="modalLock" onclick="modalCmd('LOCK_SCREEN')">🔒 Lock</button>
      <button class="modal-btn unlock" id="modalUnlock" onclick="modalCmd('UNLOCK_SCREEN')" style="display:none">🔓 Unlock</button>
      <button class="modal-btn closetabs" onclick="modalCmd('CLOSE_ALL_TABS')">✕ Close All Tabs</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let ws = null;
let students = {};
let screenshots = {};
let blockedSites = [];
let tabLimitValue = 0;
let currentView = 'screens';
let modalStudentId = null;

// ── WebSocket ──────────────────────────────────────────────────────────────

function connectWS() {
  // Auto-detect the right WebSocket URL
  const inputVal = document.getElementById('serverUrl').value.trim();
  const autoUrl = window.location.protocol === 'https:'
    ? 'wss://' + window.location.host
    : 'ws://' + window.location.host;
  const url = inputVal || autoUrl;
  document.getElementById('serverUrl').value = url;
  if (ws) { ws.onclose = null; ws.close(); }
  try { ws = new WebSocket(url); } catch(e) { toast('Invalid URL'); return; }

  ws.onopen = () => {
    setConn(true);
    ws.send(JSON.stringify({ type: 'TEACHER_CONNECT' }));
    toast('Connected ✓');
  };
  ws.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch(er) { return; }
    console.log('[Dashboard] Message received:', msg.type, msg.studentId || '');
    if (msg.type === 'STUDENT_LIST') updateStudents(msg.students);
    if (msg.type === 'STUDENT_UPDATE' && msg.student) updateStudent(msg.student);
    if (msg.type === 'SCREENSHOT') {
      console.log('[Dashboard] Screenshot received for:', msg.studentId, 'image length:', msg.image ? msg.image.length : 0);
      handleScreenshot(msg);
    }
  };
  ws.onclose = () => { setConn(false); setTimeout(connectWS, 5000); };
  ws.onerror = () => setConn(false);
}

function setConn(yes) {
  document.getElementById('connBadge').classList.toggle('connected', yes);
  document.getElementById('connText').textContent = yes ? 'Connected' : 'Disconnected';
}

function sendWS(msg) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
  else toast('Not connected');
}

// ── Screenshots ────────────────────────────────────────────────────────────

function handleScreenshot(msg) {
  console.log('[Dashboard] handleScreenshot called, studentId:', msg.studentId);
  console.log('[Dashboard] students known:', Object.keys(students));
  console.log('[Dashboard] currentView:', currentView);

  screenshots[msg.studentId] = { image: msg.image, tabTitle: msg.tabTitle, tabUrl: msg.tabUrl, name: msg.studentName };

  // If we don't know this student yet, add them
  if (!students[msg.studentId]) {
    console.log('[Dashboard] Student not in list yet, adding placeholder');
    students[msg.studentId] = { id: msg.studentId, name: msg.studentName || 'Student', isLocked: false, tabs: [], tabCount: 0, online: true };
    renderAll();
    return;
  }

  // Try fast in-place update
  const img = document.getElementById('simg_' + msg.studentId);
  console.log('[Dashboard] img element found:', !!img);
  if (img) {
    img.src = msg.image;
    img.style.display = 'block';
    const ph = document.getElementById('sph_' + msg.studentId);
    if (ph) ph.style.display = 'none';
    const tabEl = document.getElementById('stab_' + msg.studentId);
    if (tabEl) tabEl.textContent = msg.tabTitle || shortUrl(msg.tabUrl);
  } else {
    console.log('[Dashboard] No img element, re-rendering grid');
    renderAll();
  }

  // Update modal if open
  if (modalStudentId === msg.studentId) {
    document.getElementById('modalImg').src = msg.image;
    document.getElementById('modalTabTitle').textContent = msg.tabTitle || msg.tabUrl || '';
  }
}

// ── Students ───────────────────────────────────────────────────────────────

function updateStudents(list) {
  students = {};
  list.forEach(s => { if (s) students[s.id] = s; });
  renderAll();
}

function updateStudent(s) {
  if (!s) return;
  students[s.id] = s;
  renderAll();
}

function renderAll() {
  const ids = Object.keys(students);
  document.getElementById('studentCount').textContent = ids.length;
  document.getElementById('emptyState').style.display = ids.length ? 'none' : 'block';

  // Update target select
  const sel = document.getElementById('targetSelect');
  const cur = sel.value;
  sel.innerHTML = '<option value="all">🌐 All Students</option>';
  ids.forEach(id => {
    const o = document.createElement('option');
    o.value = id; o.textContent = '👤 ' + students[id].name;
    sel.appendChild(o);
  });
  if (cur && students[cur]) sel.value = cur;

  if (currentView === 'tabs') renderTabsGrid(ids);
  else renderScreensGrid(ids);
}

// ── Tabs View ──────────────────────────────────────────────────────────────

function renderTabsGrid(ids) {
  const grid = document.getElementById('tabsGrid');
  grid.innerHTML = '';
  ids.forEach(id => grid.appendChild(makeTabCard(students[id])));
}

function makeTabCard(s) {
  const div = document.createElement('div');
  div.className = 'student-card' + (s.isLocked ? ' locked' : '');
  const init = (s.name||'?')[0].toUpperCase();
  const tabsHtml = (s.tabs||[]).slice(0,8).map(t => `
    <div class="tab-item">
      ${t.favIconUrl ? `<img class="tab-favicon" src="${t.favIconUrl}" onerror="this.style.display='none'">` : '<span class="tab-favicon">📄</span>'}
      <span class="tab-title">${esc(t.title||'Loading...')}</span>
      <span class="tab-url">${esc(shortUrl(t.url))}</span>
      <button class="tab-close" onclick="closeTab('${s.id}',${t.id})">✕</button>
    </div>`).join('');
  div.innerHTML = `
    <div class="card-header">
      <div class="avatar">${init}</div>
      <div><div class="card-name">${esc(s.name)}</div><div class="card-id">${s.tabCount||0} tabs</div></div>
      <div class="card-badges">
        ${s.isLocked?'<span class="badge locked">🔒</span>':''}
        <span class="badge online">● Online</span>
      </div>
    </div>
    <div class="card-tabs">${tabsHtml||'<div style="font-size:11px;color:var(--muted);padding:6px 0">No tabs</div>'}</div>
    <div class="card-footer">
      ${s.isLocked
        ? `<button class="card-action unlock" onclick="unlockStudent('${s.id}')">🔓 Unlock</button>`
        : `<button class="card-action lock" onclick="lockStudent('${s.id}')">🔒 Lock</button>`}
      <button class="card-action closetabs" onclick="closeAllStudentTabs('${s.id}')">✕ Tabs</button>
    </div>`;
  return div;
}

// ── Screens View ───────────────────────────────────────────────────────────

function renderScreensGrid(ids) {
  const grid = document.getElementById('screensGrid');
  grid.innerHTML = '';
  ids.forEach(id => grid.appendChild(makeScreenCard(students[id])));
}

function makeScreenCard(s) {
  const sc = screenshots[s.id];
  const div = document.createElement('div');
  div.className = 'screen-card' + (s.isLocked ? ' locked' : '');
  div.onclick = () => openModal(s.id);
  const init = (s.name||'?')[0].toUpperCase();
  div.innerHTML = `
    <div class="screen-header">
      <div class="avatar" style="width:24px;height:24px;font-size:11px;border-radius:5px">${init}</div>
      <div>
        <div class="screen-name">${esc(s.name)}</div>
        <div class="screen-tab" id="stab_${s.id}">${sc ? esc(sc.tabTitle||shortUrl(sc.tabUrl)) : 'Waiting for screenshot...'}</div>
      </div>
      ${s.isLocked ? '<span class="badge locked">🔒 Locked</span>' : ''}
    </div>
    <div class="screen-preview">
      ${sc
        ? `<img id="simg_${s.id}" src="${sc.image}" style="width:100%;height:100%;object-fit:cover;display:block">`
        : `<img id="simg_${s.id}" src="" style="display:none"><div class="screen-placeholder" id="sph_${s.id}"><div class="ph-icon">🖥️</div><div>Waiting for screen...</div></div>`
      }
      ${s.isLocked ? '<div class="screen-lock-overlay"><div class="lock-icon">🔒</div><div>Screen Locked</div></div>' : ''}
    </div>
    <div class="screen-footer" onclick="event.stopPropagation()">
      ${s.isLocked
        ? `<button class="screen-btn unlock" onclick="unlockStudent('${s.id}')">🔓 Unlock</button>`
        : `<button class="screen-btn lock" onclick="lockStudent('${s.id}')">🔒 Lock</button>`}
      <button class="screen-btn closetabs" onclick="closeAllStudentTabs('${s.id}')">✕ Close Tabs</button>
    </div>`;
  return div;
}

// ── Modal ──────────────────────────────────────────────────────────────────

function openModal(studentId) {
  modalStudentId = studentId;
  const s = students[studentId];
  const sc = screenshots[studentId];
  document.getElementById('modalTitle').textContent = s ? s.name : 'Student';
  document.getElementById('modalTabTitle').textContent = sc ? (sc.tabTitle || sc.tabUrl || '') : '';
  document.getElementById('modalImg').src = sc ? sc.image : '';
  document.getElementById('modalLock').style.display = s?.isLocked ? 'none' : '';
  document.getElementById('modalUnlock').style.display = s?.isLocked ? '' : 'none';
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('open');
    modalStudentId = null;
  }
}

function modalCmd(command) {
  if (!modalStudentId) return;
  sendWS({ type: 'TEACHER_COMMAND', command, targetId: modalStudentId, payload: {} });
  toast('Sent: ' + command.replace(/_/g,' '));
  if (command === 'LOCK_SCREEN' && students[modalStudentId]) students[modalStudentId].isLocked = true;
  if (command === 'UNLOCK_SCREEN' && students[modalStudentId]) students[modalStudentId].isLocked = false;
  document.getElementById('modalLock').style.display = students[modalStudentId]?.isLocked ? 'none' : '';
  document.getElementById('modalUnlock').style.display = students[modalStudentId]?.isLocked ? '' : 'none';
}

// ── View Toggle ────────────────────────────────────────────────────────────

function setView(v) {
  currentView = v;
  document.getElementById('tabsGrid').style.display = v === 'tabs' ? '' : 'none';
  document.getElementById('screensGrid').style.display = v === 'screens' ? '' : 'none';
  document.getElementById('btnTabView').classList.toggle('active', v === 'tabs');
  document.getElementById('btnScreenView').classList.toggle('active', v === 'screens');
  renderAll();
}

// ── Commands ───────────────────────────────────────────────────────────────

function getTarget() { return document.getElementById('targetSelect').value; }
function cmd(command, payload={}) {
  sendWS({ type:'TEACHER_COMMAND', command, targetId:getTarget(), payload });
  toast('Sent: ' + command.replace(/_/g,' '));
}
function lockStudent(id) { sendWS({ type:'TEACHER_COMMAND', command:'LOCK_SCREEN', targetId:id, payload:{} }); toast('Locked'); }
function unlockStudent(id) { sendWS({ type:'TEACHER_COMMAND', command:'UNLOCK_SCREEN', targetId:id, payload:{} }); toast('Unlocked'); }
function closeAllStudentTabs(id) { sendWS({ type:'TEACHER_COMMAND', command:'CLOSE_ALL_TABS', targetId:id, payload:{} }); toast('Closing tabs...'); }
function closeTab(sid, tabId) { sendWS({ type:'TEACHER_COMMAND', command:'CLOSE_TAB', targetId:sid, payload:{tabId} }); }
function applyTabLimit() { cmd('SET_TAB_LIMIT', { limit: tabLimitValue }); }
function applyBlockList() { cmd('BLOCK_SITES', { sites: blockedSites }); }
function clearBlockList() { blockedSites=[]; renderSiteList(); cmd('BLOCK_SITES', { sites:[] }); }
function applyNavigate() {
  let url = document.getElementById('navInput').value.trim();
  if (!url) return;
  if (!url.startsWith('http')) url = 'https://' + url;
  cmd('NAVIGATE_TO', { url });
}
function updateTabLimit(v) {
  tabLimitValue = parseInt(v);
  document.getElementById('tabLimitVal').textContent = tabLimitValue === 0 ? 'Off' : tabLimitValue;
}

// ── Sites ──────────────────────────────────────────────────────────────────

function addSite() {
  let val = document.getElementById('siteInput').value.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/\/$/,'');
  if (!val || blockedSites.includes(val)) return;
  blockedSites.push(val); renderSiteList();
  document.getElementById('siteInput').value = '';
}
function removeSite(s) { blockedSites = blockedSites.filter(x=>x!==s); renderSiteList(); }
function renderSiteList() {
  document.getElementById('siteList').innerHTML = blockedSites.map(s =>
    `<span class="site-tag">${esc(s)}<button onclick="removeSite('${s}')">✕</button></span>`).join('');
}

// ── Helpers ────────────────────────────────────────────────────────────────

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shortUrl(url) { try { return new URL(url).hostname; } catch(e) { return url||''; } }

let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('show'), 2500);
}

connectWS();
</script>
</body>
</html>
