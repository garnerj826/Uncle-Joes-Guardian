<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Browsing Disabled</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height:100%; width:100%; overflow:hidden;
  background:#1a1a2e;
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color:#fff;
}
body {
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:16px;
}

.gif-container {
  width:280px; height:280px;
  display:flex; align-items:center; justify-content:center;
}
.gif-container img {
  max-width:100%; max-height:100%;
  border-radius:12px;
}

h1 {
  font-size:36px;
  font-weight:800;
  color:#fff;
  letter-spacing:1px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  text-align:center;
}

.message-box {
  background:rgba(74,144,200,0.85);
  border-radius:8px;
  padding:14px 22px;
  max-width:380px;
  width:90%;
}
.message-time {
  font-size:11px; font-weight:700; letter-spacing:1.5px;
  text-transform:uppercase; color:rgba(255,255,255,0.7); margin-bottom:4px;
}
.message-label {
  font-size:9px; font-weight:700; letter-spacing:2px;
  text-transform:uppercase; color:rgba(255,255,255,0.6); margin-bottom:6px;
}
.message-quote { font-size:15px; line-height:1.5; }
.message-quote::before { content:'\201c'; font-size:18px; vertical-align:-2px; margin-right:2px; }
.no-message { font-size:13px; color:rgba(255,255,255,0.4); }
</style>
</head>
<body>

<div class="gif-container">
  <img src="jurassic-park.gif" alt="Browsing Disabled">
</div>

<h1>Browsing Is Disabled!</h1>

<div class="no-message">Your teacher has disabled browsing.</div>

<script>
const params = new URLSearchParams(location.search);
const message = params.get('msg') || '';
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && ['w','t','n','r'].includes(e.key.toLowerCase())) {
    e.preventDefault(); e.stopPropagation(); return false;
  }
  if (e.key==='F5'||e.key==='F11') { e.preventDefault(); return false; }
}, true);
document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
